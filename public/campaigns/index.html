<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>双灯夜航 · 规则原型</title><link rel="stylesheet" href="./styles.css"></head><body><header><div><span class="tag">候选 C · 夜航标准 · 开发预览</span><h1>双灯夜航</h1><p>五处泊位，一艘渡船。油料只在确认离岸时消耗</p></div><span class="tag">规则验证预览 · 正式美术待制作</span></header><main><section class="exploration"><div id="route" class="route"></div><div class="scene-heading"><div><h2 id="region-title"></h2><p id="position"></p></div><span id="phase"></span></div><div id="board" aria-label="11乘11逻辑地图"></div><p class="legend">◎ 璃　⚓ 船/跳板　▣ 作业　◆ 补给　⚙ 固定障碍　● 配重</p><div class="direction-pad" aria-label="移动"><button data-dir="up">↑</button><div><button data-dir="left">←</button><button data-dir="down">↓</button><button data-dir="right">→</button></div></div><p class="prototype">占位棋盘与功能图标，尚未制作正式场景美术。当前为规则全链原型，不代表三难度最终平衡</p></section><aside><section class="panel"><h2>航行账本</h2><div id="stats"></div><p id="budget"></p><p id="cargo"></p><p id="balance-ledger"></p><details><summary>全路线预判与两处完整敌情</summary><div id="route-forecast"></div></details></section><section class="panel"><h2>眼前的操作</h2><p class="hint">点地图先走到目标旁边，再执行操作。WASD / 方向键同样可用</p><div id="actions"></div></section><section class="panel"><h2>存档与核对</h2><div class="tools"><button id="save">手动保存</button><button id="load-auto">读取自动档</button><button id="load-manual">读取手动档</button><select id="checkpoint-select" aria-label="选择泊位检查点"></select><button id="checkpoint">恢复所选泊位初态</button><button id="new">重新开始</button></div><details><summary>规则回放</summary><p>从真实新游戏状态逐条执行已验证动作，不写入通关旗标</p><button id="replay-load">载入标准胜路</button><button id="replay-step" disabled>下一步</button><button id="replay-auto" disabled>连续重放</button><p id="replay-info"></p></details></section><section class="panel"><h2>最近发生</h2><ol id="log"></ol></section></aside></main><div id="status" role="status" aria-live="polite"></div><dialog id="confirmation"><h2 id="confirm-title"></h2><p id=
