<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <title>10F Visual Audit</title>
    <style>
      html,body{margin:0;min-height:100%;background:#060914;color:#dcecff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
      body{display:grid;place-items:center;min-height:100vh;overflow:hidden}
      main{display:grid;gap:8px;justify-items:center}
      #audit-label{font-size:12px;font-weight:700;letter-spacing:.08em;color:#a9c4df}
      #game-container{width:638px;height:638px;line-height:0}
      #game-container canvas{display:block;width:638px!important;height:638px!important;max-width:none!important;max-height:none!important}
      #audit-error{position:fixed;left:12px;bottom:12px;max-width:680px;color:#ff9ab1;font:12px/1.45 ui-monospace,SFMono-Regular,Consolas,monospace;white-space:pre-wrap}
    </style>
  </head>
  <body>
    <main>
      <div id="audit-label">LOADING VISUAL AUDIT…</div>
      <div id="game-container" aria-label="Visual audit map"></div>
    </main>
    <pre id="audit-error"></pre>
    <script type="module" src="/src/visual-audit-main.js"></script>
  </body>
</html>
