<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self' data:; object-src 'none'; base-uri 'self'" />
    <meta name="theme-color" content="#07101c" />
    <meta name="description" content="保留经典魔塔固定数值、钥匙门、宝物、商店与解谜机制的日系二次元策略 RPG。" />
    <meta name="robots" content="index,follow" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>失落魔法阵：少女魔塔</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body data-theme="night">
    <div id="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">FIXED-NUMBER STRATEGY RPG</p>
          <h1>失落魔法阵：少女魔塔</h1>
        </div>
        <div class="top-actions">
          <button id="btn-theme" class="ghost">主题·暗夜</button>
          <button id="btn-help" class="ghost">玩法</button>
          <button id="btn-save" class="ghost">存档</button>
          <button id="btn-load" class="ghost">读档</button>
          <button id="btn-reset" class="danger ghost">重开</button>
        </div>
      </header>

      <main class="game-layout">
        <aside class="panel stats-panel" aria-label="角色状态">
          <section class="hero-card">
            <img data-portrait="hero" alt="主角绫星·璃" />
            <div>
              <span class="label">失魔术师</span>
              <h2>绫星·璃</h2>
              <p id="magic-title">魔力回收率 0%</p>
            </div>
          </section>

          <section class="floor-card">
            <span id="floor-number">第 1 阵</span>
            <strong id="floor-title">月白门廊</strong>
          </section>

          <dl class="stat-grid stat-grid-icons" aria-label="核心数值">
            <div class="stat-entry hp-entry">
              <dt aria-label="生命" title="生命">
                <svg class="stat-icon hp" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-8-4.8-9.6-9.2C.7 8.1 2.8 4.6 6.5 4.5c2.4-.1 4.1 1.3 5.5 3.2 1.4-1.9 3.1-3.3 5.5-3.2 3.7.1 5.8 3.6 4.1 7.3C20 16.2 12 21 12 21Z"/></svg>
              </dt>
              <dd id="stat-hp">0</dd>
            </div>
            <div class="stat-entry atk-entry">
              <dt aria-label="攻击" title="攻击">
                <svg class="stat-icon atk" viewBox="0 0 24 24" aria-hidden="true"><path d="m14.7 3.1 6.2 0-0.1 6.2-3-3-7.6 7.6 1.9 1.9-2 2-5.9-5.9 2-2 1.9 1.9 7.6-7.6-1-1.1ZM3 15.2l5.8 5.8H3v-5.8Z"/></svg>
              </dt>
              <dd id="stat-atk">0</dd>
            </div>
            <div class="stat-entry def-entry">
              <dt aria-label="防御" title="防御">
                <svg class="stat-icon def" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5 20 5v6.2c0 5.1-3.2 8.8-8 10.5-4.8-1.7-8-5.4-8-10.5V5l8-2.5Zm0 3L7 7v4.2c0 3.4 1.9 5.9 5 7.3 3.1-1.4 5-3.9 5-7.3V7l-5-1.5Z"/></svg>
              </dt>
              <dd id="stat-def">0</dd>
            </div>
            <div class="stat-entry gold-entry">
              <dt aria-label="金币" title="金币">
                <svg class="stat-icon gold" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5c5.5 0 9.5 2.5 9.5 5.7v7.6c0 3.2-4 5.7-9.5 5.7S2.5 19 2.5 15.8V8.2c0-3.2 4-5.7 9.5-5.7Zm0 3c-4 0-6.5 1.5-6.5 2.7S8 11 12 11s6.5-1.5 6.5-2.8S16 5.5 12 5.5Zm-6.5 7v3.3c0 1.2 2.5 2.7 6.5 2.7s6.5-1.5 6.5-2.7v-3.3c-1.7 1-4 1.5-6.5 1.5s-4.8-.5-6.5-1.5Z"/></svg>
              </dt>
              <dd id="stat-gold">0</dd>
            </div>
          </dl>

          <section class="card-wallet framed-wallet" aria-label="结界钥匙">
            <div class="card-token sun" title="日曜卡"><span class="card-emblem" aria-hidden="true">☀</span><b id="card-sun">0</b></div>
            <div class="card-token moon" title="月辉卡"><span class="card-emblem" aria-hidden="true">☾</span><b id="card-moon">0</b></div>
            <div class="card-token star" title="星蚀卡"><span class="card-emblem" aria-hidden="true">✦</span><b id="card-star">0</b></div>
          </section>

          <section class="relics">
            <h3>宝物 / 遗物</h3>
            <div id="relic-list" class="relic-list"><span class="muted">尚未获得</span></div>
          </section>
        </aside>

        <section class="board-column">
          <div id="game-container" aria-label="魔塔地图画布"></div>
          <div id="loading-note" class="loading-note">正在加载魔法塔素材……</div>
          <div class="mobile-controls" aria-label="移动控制">
            <span></span><button data-move="up" aria-label="向上">▲</button><span></span>
            <button data-move="left" aria-label="向左">◀</button><button data-move="down" aria-label="向下">▼</button><button data-move="right" aria-label="向右">▶</button>
          </div>
          <p class="control-hint">方向键 / WASD 移动 · 点击相邻格亦可行动 · E 查看图鉴 · T 使用楼层罗盘</p>
        </section>

        <aside class="panel intel-panel" aria-label="战术情报">
          <section>
            <h3>邻格预判</h3>
            <div id="battle-preview" class="battle-preview muted">靠近敌人后显示固定损伤。</div>
          </section>
          <section>
            <h3>阵内目标</h3>
            <p id="floor-objective">寻找被封印的魔力核心。</p>
          </section>
          <section>
            <h3>行动记录</h3>
            <ol id="log-list" class="log-list"></ol>
          </section>
          <section class="intel-actions">
            <button id="btn-codex">敌人图鉴</button>
            <button id="btn-teleport">楼层罗盘</button>
          </section>
        </aside>
      </main>
    </div>

    <div id="modal-root" class="modal-root hidden" role="dialog" aria-modal="true">
      <div class="modal-backdrop"></div>
      <section class="modal-card">
        <div class="modal-heading">
          <div>
            <span id="modal-kicker" class="eyebrow"></span>
            <h2 id="modal-title"></h2>
          </div>
          <button id="modal-close" class="icon-button" aria-label="关闭">×</button>
        </div>
        <div id="modal-body" class="modal-body"></div>
        <div id="modal-actions" class="modal-actions"></div>
      </section>
    </div>

    <noscript>本游戏需要启用 JavaScript。</noscript>
    <script src="/src/game/v8-atlas-fetch-shim.js"></script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
