<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self' data:; object-src 'none'; base-uri 'self'" />
    <meta name="theme-color" content="#07101c" />
    <meta name="description" content="30 层三章节魔塔：以固定数值、钥匙门、互斥选择、会战部署与可调魔力附刃构成的日系二次元策略 RPG。" />
    <meta name="robots" content="index,follow" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>失落魔法阵：少女魔塔 · 30F 三章节</title>
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/ui-v8-5.css?v=5" />
    <link rel="stylesheet" href="/ui-v10-cinematics.css?v=15" />
  </head>
  <body data-theme="night">
    <div id="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">30F THREE-ACT CAMPAIGN · FIXED-NUMBER STRATEGY RPG</p>
          <h1>失落魔法阵：少女魔塔</h1>
        </div>
        <div class="top-actions">
          <button id="btn-theme" class="ghost">主题·暗夜</button>
          <button id="btn-help" class="ghost">玩法</button>
          <button id="btn-save" class="ghost">存档</button>
          <button id="btn-load" class="ghost">读档</button>
          <button id="btn-reset" class="danger ghost">重开</button>
        </div>
      </header>

      <main class="game-layout">
        <aside class="panel stats-panel" aria-label="角色状态">
          <section class="hero-card">
            <img data-portrait="hero" alt="主角绫星·璃" />
            <div>
              <span class="label">失魔术师</span>
              <h2>绫星·璃</h2>
              <p id="magic-title">魔力回收率 0%</p>
              <button id="btn-magic-tier" class="ghost magic-tier-button" disabled>魔力附刃</button>
            </div>
          </section>

          <section class="floor-card">
            <span id="floor-number">第 1 阵</span>
            <strong id="floor-title">月白门廊</strong>
          </section>

          <dl class="stat-grid stat-grid-icons stat-row-v85" aria-label="核心数值">
            <div class="stat-entry hp-entry" title="生命">
              <dt class="stat-glyph" aria-label="生命">
                <svg class="stat-icon" viewBox="0 0 24 24" aria-hidden="true"><path fill="#ff8da9" d="M12 21s-8-4.8-9.6-9.2C.7 8.1 2.8 4.6 6.5 4.5c2.4-.1 4.1 1.3 5.5 3.2 1.4-1.9 3.1-3.3 5.5-3.2 3.7.1 5.8 3.6 4.1 7.3C20 16.2 12 21 12 21Z"/></svg>
              </dt>
              <dd id="stat-hp">0</dd>
            </div>
            <div class="stat-entry atk-entry" title="攻击">
              <dt class="stat-glyph" aria-label="攻击">
                <svg class="stat-icon" viewBox="0 0 24 24" aria-hidden="true"><path fill="#f3b47d" d="M19.8 2.5 21.5 4.2 14 11.7l1.7 1.7-2.3 2.3-5.1-5.1 2.3-2.3 1.7 1.7 7.5-7.5ZM7.2 11.7l5.1 5.1-2 2-1.4-1.4-3.7 3.7H2.9v-2.3l3.7-3.7-1.4-1.4 2-2Z"/></svg>
              </dt>
              <dd id="stat-atk">0</dd>
            </div>
            <div class="stat-entry def-entry" title="防御">
              <dt class="stat-glyph" aria-label="防御">
                <svg class="stat-icon" viewBox="0 0 24 24" aria-hidden="true"><path fill="#85caf5" d="M12 2.4 20 5v6.1c0 5.2-3.2 8.9-8 10.6-4.8-1.7-8-5.4-8-10.6V5l8-2.6Zm0 3.2L7 7.2v3.9c0 3.5 1.9 5.9 5 7.3 3.1-1.4 5-3.8 5-7.3V7.2l-5-1.6Z"/></svg>
              </dt>
              <dd id="stat-def">0</dd>
            </div>
            <div class="stat-entry gold-entry" title="金币">
              <dt class="stat-glyph" aria-label="金币">
                <svg class="stat-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="#e9c75f"/><circle cx="12" cy="12" r="6.4" fill="none" stroke="#fff1a2" stroke-width="1.2"/><path fill="#6d5314" d="M10.3 7.4h3.3v1.4h-2v2.1h1.8v1.4h-1.8v2.2h2.2v1.4h-3.5V7.4Z"/></svg>
              </dt>
              <dd id="stat-gold">0</dd>
            </div>
          </dl>

          <section class="card-wallet framed-wallet card-wallet-v85" aria-label="结界钥匙">
            <div class="card-token sun" title="日曜卡">
              <span class="card-emblem" aria-hidden="true">
                <svg class="card-icon-svg sun-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.3" fill="currentColor"/><g stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 2.4v3M12 18.6v3M2.4 12h3M18.6 12h3M5.2 5.2l2.1 2.1M16.7 16.7l2.1 2.1M18.8 5.2l-2.1 2.1M7.3 16.7l-2.1 2.1"/></g></svg>
              </span>
              <b id="card-sun">0</b>
            </div>
            <div class="card-token moon" title="月辉卡">
              <span class="card-emblem" aria-hidden="true">
                <svg class="card-icon-svg moon-icon" viewBox="0 0 24 24"><path fill="currentColor" d="M15.8 3.1A8.7 8.7 0 1 0 20.9 17 7.2 7.2 0 0 1 15.8 3.1Z"/><path fill="rgba(255,255,255,.3)" d="M16.2 5.7a6.2 6.2 0 0 0 1.6 9.5 6.7 6.7 0 1 1-1.6-9.5Z"/></svg>
              </span>
              <b id="card-moon">0</b>
            </div>
            <div class="card-token star" title="星蚀卡">
              <span class="card-emblem" aria-hidden="true">
                <svg class="card-icon-svg star-icon" viewBox="0 0 24 24"><path fill="currentColor" d="m12 2.5 2.6 6 6.5.6-4.9 4.3 1.5 6.4-5.7-3.4-5.7 3.4 1.5-6.4-4.9-4.3 6.5-.6L12 2.5Z"/><circle cx="12" cy="12" r="2" fill="rgba(255,255,255,.42)"/></svg>
              </span>
              <b id="card-star">0</b>
            </div>
          </section>

          <section class="relics">
            <h3>宝物 / 遗物</h3>
            <div id="relic-list" class="relic-list"><span class="muted">尚未获得</span></div>
          </section>
        </aside>

        <section class="board-column">
          <div id="game-container" aria-label="魔塔地图画布"></div>
          <div id="loading-note" class="loading-note">正在加载 30 层三章节魔法塔……</div>
          <div class="mobile-controls" aria-label="移动控制">
            <span></span><button data-move="up" aria-label="向上">▲</button><span></span>
            <button data-move="left" aria-label="向左">◀</button><button data-move="down" aria-label="向下">▼</button><button data-move="right" aria-label="向右">▶</button>
          </div>
          <p class="control-hint">方向键 / WASD 移动 · 点击相邻格行动 · 悬停查看地图单位；触摸一次查看、再点同格行动 · R 见证契约 / 修复章程 · E 图鉴 · T 罗盘 · M 魔力附刃</p>
        </section>

        <aside class="panel intel-panel" aria-label="战术情报">
          <section>
            <h3>邻格预判</h3>
            <div id="battle-preview" class="battle-preview muted">靠近敌人后显示固定损伤。</div>
          </section>
          <section>
            <h3>最近 12 条行动记录</h3>
            <ol id="log-list" class="log-list"></ol>
          </section>
          <section class="intel-actions">
            <button id="btn-doctrine" disabled>见证契约</button>
            <button id="btn-codex">敌人图鉴</button>
            <button id="btn-teleport">楼层罗盘</button>
            <button id="btn-magic" disabled>魔力附刃</button>
          </section>
        </aside>
      </main>
    </div>

    <div id="modal-root" class="modal-root hidden" role="dialog" aria-modal="true">
      <div class="modal-backdrop"></div>
      <section class="modal-card">
        <div class="modal-heading">
          <div>
            <span id="modal-kicker" class="eyebrow"></span>
            <h2 id="modal-title"></h2>
          </div>
          <button id="modal-close" class="icon-button" aria-label="关闭">×</button>
        </div>
        <div id="modal-body" class="modal-body"></div>
        <div id="modal-actions" class="modal-actions"></div>
      </section>
    </div>

    <!-- Kept separate from the tactical modal on purpose: story scenes own a
         fixed visual-novel stage and must never inherit scrollable game UI. -->
    <section id="gal-root" class="gal-root hidden" role="dialog" aria-modal="true" aria-label="剧情演出"></section>

    <noscript>本游戏需要启用 JavaScript。</noscript>
    <script type="module" src="/src/demo-main.js"></script>
  </body>
</html>
