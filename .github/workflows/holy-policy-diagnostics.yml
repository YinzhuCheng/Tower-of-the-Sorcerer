name: Holy Policy Diagnostics

on:
  push:
    branches:
      - solver-phase1-pareto
    paths:
      - 'src/analyzer/holy-policy-best-response.js'
      - 'src/analyzer/holy-policy-solver-seed.js'
      - 'src/analyzer/pre-holy-stage-proof.js'
      - 'src/analyzer/pre-holy-boundary-frontier.js'
      - 'src/analyzer/purchase-prefix-rescue.js'
      - 'src/solver/goal-frontier.js'
      - 'src/solver/holy-policy-adapter.js'
      - 'src/solver/pre-holy-stage-adapter.js'
      - 'src/solver/replay.js'
      - 'scripts/analyze-holy-policy-solver-seeds.mjs'
      - 'scripts/analyze-pre-holy-f6.mjs'
      - 'scripts/analyze-pre-holy-frontier.mjs'
      - 'scripts/diagnose-holy-purchase-rescue.mjs'
      - '.github/workflows/holy-policy-diagnostics.yml'
  pull_request:
    paths:
      - 'src/analyzer/holy-policy-best-response.js'
      - 'src/analyzer/holy-policy-solver-seed.js'
      - 'src/analyzer/pre-holy-stage-proof.js'
      - 'src/analyzer/pre-holy-boundary-frontier.js'
      - 'src/analyzer/purchase-prefix-rescue.js'
      - 'src/solver/goal-frontier.js'
      - 'src/solver/holy-policy-adapter.js'
      - 'src/solver/pre-holy-stage-adapter.js'
      - 'src/solver/replay.js'
      - 'scripts/analyze-holy-policy-solver-seeds.mjs'
      - 'scripts/analyze-pre-holy-f6.mjs'
      - 'scripts/analyze-pre-holy-frontier.mjs'
      - 'scripts/diagnose-holy-purchase-rescue.mjs'
      - '.github/workflows/holy-policy-diagnostics.yml'
  workflow_dispatch:

jobs:
  rescue-diagnostic:
    strategy:
      fail-fast: false
      matrix:
        policy:
          - after-core-6
          - after-core-7
          - before-final
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deep deterministic purchase-prefix rescue
        env:
          HOLY_POLICY: ${{ matrix.policy }}
        run: |
          node scripts/diagnose-holy-purchase-rescue.mjs \
            --policy="$HOLY_POLICY" \
            --max-depth=20 \
            --beam-width=24 \
            --max-evaluations=2000 \
            --json > "holy-purchase-rescue-$HOLY_POLICY.json"
      - name: Print compact rescue diagnostic
        env:
          HOLY_POLICY: ${{ matrix.policy }}
        run: |
          python3 - <<'PY'
          import json, os
          p=os.environ['HOLY_POLICY']
          rescue=json.load(open(f'holy-purchase-rescue-{p}.json'))
          progress=(rescue.get('bestProgress') or {}).get('result') or {}
          print(f"RESCUE policy={p} found={rescue.get('found')} depth={rescue.get('depth')} evals={rescue.get('evaluations')} stop={rescue.get('stoppedReason')} bestFloor={progress.get('floor')} bestCores={progress.get('cores')} bestBattles={progress.get('battles')} bestPurchases={progress.get('purchases')} holy={progress.get('holy')} failure={progress.get('failure')}")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: holy-purchase-rescue-${{ matrix.policy }}
          path: holy-purchase-rescue-${{ matrix.policy }}.json
          if-no-files-found: error
          retention-days: 7

  pre-holy-f6-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Collect replayable F6 core5 boundary frontier
        run: |
          node scripts/analyze-pre-holy-frontier.mjs \
            --max-expanded=25000 \
            --max-generated=250000 \
            --json > pre-holy-f6-boundary.json
      - name: Print compact boundary summary
        run: |
          python3 - <<'PY'
          import json
          r=json.load(open('pre-holy-f6-boundary.json'))
          s=r.get('solver') or {}
          print(f"BOUNDARY found={r.get('hasBoundaryStates')} exact={r.get('coverageExact')} verified={r.get('verifiedSeedCount')}/{r.get('seedCount')} stop={r.get('stoppedReason')} expanded={s.get('expandedStates')} generated={s.get('generatedStates')} goalStates={s.get('goalStructuralStates')} activeGoals={s.get('activeGoalLabels')} interpretation={r.get('interpretation')}")
          for x in (r.get('seeds') or [])[:12]:
              res=x.get('resources') or {}
              print(f"BOUNDARY_SEED cert={x.get('certificateHash')} steps={x.get('certificateSteps')} hp={res.get('hp')} atk={res.get('atk')} def={res.get('def')} gold={res.get('gold')} cards={res.get('sun')}/{res.get('moon')}/{res.get('star')} verified={x.get('verified')}")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: pre-holy-f6-boundary
          path: pre-holy-f6-boundary.json
          if-no-files-found: error
          retention-days: 7

  pre-holy-f6-stage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prove shared pre-Holy F6 stages
        run: |
          node scripts/analyze-pre-holy-f6.mjs \
            --max-expanded=25000 \
            --max-generated=250000 \
            --json > pre-holy-f6-stage.json
      - name: Print compact F6 stage summary
        run: |
          python3 - <<'PY'
          import json
          r=json.load(open('pre-holy-f6-stage.json'))
          print(f"PRE_HOLY_F6 interpretation={r.get('interpretation')}")
          for name in ('preBoss','core6'):
              x=r[name]
              final=(x.get('authoritativeReplay') or {}).get('final') or (x.get('certificate') or {}).get('final') or {}
              stats=final.get('stats') or {}
              print(f"F6_STAGE stage={name} reached={x.get('reached')} exact={x.get('exact')} stop={x.get('stoppedReason')} expanded={(x.get('solver') or {}).get('expandedStates')} generated={(x.get('solver') or {}).get('generatedStates')} floor={final.get('floor')} cores={final.get('cores')} hp={stats.get('hp')} atk={stats.get('atk')} def={stats.get('def')}")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: pre-holy-f6-stage
          path: pre-holy-f6-stage.json
          if-no-files-found: error
          retention-days: 7

  solver-diagnostic:
    strategy:
      fail-fast: false
      matrix:
        policy:
          - after-core-6
          - after-core-7
          - before-final
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Policy-constrained Solver feasibility and certificate seed
        env:
          HOLY_POLICY: ${{ matrix.policy }}
        run: |
          node scripts/analyze-holy-policy-solver-seeds.mjs \
            --policy="$HOLY_POLICY" \
            --max-expanded=25000 \
            --max-generated=250000 \
            --json > "holy-policy-solver-seed-$HOLY_POLICY.json"
      - name: Print compact Solver diagnostic
        env:
          HOLY_POLICY: ${{ matrix.policy }}
        run: |
          python3 - <<'PY'
          import json, os
          p=os.environ['HOLY_POLICY']
          solver=json.load(open(f'holy-policy-solver-seed-{p}.json'))['results'][0]
          auth=solver.get('authoritativeReplay') or {}
          replay=solver.get('deterministicReplay') or {}
          print(f"SOLVER policy={p} feasible={solver.get('policyFeasible')} exact={solver.get('exact')} stop={solver.get('stoppedReason')} expanded={(solver.get('solver') or {}).get('expandedStates')} generated={(solver.get('solver') or {}).get('generatedStates')} certReplay={auth.get('ok')} certHp={solver.get('certifiedTerminalHpLowerBound')} greedyReplay={replay.get('solvable')} interpretation={solver.get('interpretation')}")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: holy-policy-solver-seed-${{ matrix.policy }}
          path: holy-policy-solver-seed-${{ matrix.policy }}.json
          if-no-files-found: error
          retention-days: 7
