name: Holy Policy Diagnostics

on:
  push:
    branches:
      - solver-phase1-pareto
    paths:
      - 'src/analyzer/holy-policy-best-response.js'
      - 'src/analyzer/holy-policy-solver-seed.js'
      - 'src/analyzer/pre-holy-stage-proof.js'
      - 'src/analyzer/pre-holy-boundary-frontier.js'
      - 'src/analyzer/pre-holy-seed-scheduler.js'
      - 'src/analyzer/staged-holy-policy-proof.js'
      - 'src/analyzer/purchase-prefix-rescue.js'
      - 'src/solver/goal-frontier.js'
      - 'src/solver/holy-policy-adapter.js'
      - 'src/solver/pre-holy-stage-adapter.js'
      - 'src/solver/replay.js'
      - 'scripts/analyze-holy-policy-solver-seeds.mjs'
      - 'scripts/analyze-pre-holy-f6.mjs'
      - 'scripts/analyze-pre-holy-frontier.mjs'
      - 'scripts/analyze-staged-holy-proof.mjs'
      - 'scripts/diagnose-holy-purchase-rescue.mjs'
      - '.github/workflows/holy-policy-diagnostics.yml'
  pull_request:
    paths:
      - 'src/analyzer/holy-policy-best-response.js'
      - 'src/analyzer/holy-policy-solver-seed.js'
      - 'src/analyzer/pre-holy-stage-proof.js'
      - 'src/analyzer/pre-holy-boundary-frontier.js'
      - 'src/analyzer/pre-holy-seed-scheduler.js'
      - 'src/analyzer/staged-holy-policy-proof.js'
      - 'src/analyzer/purchase-prefix-rescue.js'
      - 'src/solver/goal-frontier.js'
      - 'src/solver/holy-policy-adapter.js'
      - 'src/solver/pre-holy-stage-adapter.js'
      - 'src/solver/replay.js'
      - 'scripts/analyze-holy-policy-solver-seeds.mjs'
      - 'scripts/analyze-pre-holy-f6.mjs'
      - 'scripts/analyze-pre-holy-frontier.mjs'
      - 'scripts/analyze-staged-holy-proof.mjs'
      - 'scripts/diagnose-holy-purchase-rescue.mjs'
      - '.github/workflows/holy-policy-diagnostics.yml'
  workflow_dispatch:

concurrency:
  group: holy-policy-diagnostics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rescue-diagnostic:
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        policy: [after-core-6, after-core-7, before-final]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Deep deterministic purchase-prefix rescue
        env: { HOLY_POLICY: '${{ matrix.policy }}' }
        run: node scripts/diagnose-holy-purchase-rescue.mjs --policy="$HOLY_POLICY" --max-depth=20 --beam-width=24 --max-evaluations=2000 --json > "holy-purchase-rescue-$HOLY_POLICY.json"
      - uses: actions/upload-artifact@v4
        with:
          name: holy-purchase-rescue-${{ matrix.policy }}
          path: holy-purchase-rescue-${{ matrix.policy }}.json
          retention-days: 7

  pre-holy-f6-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Collect replayable F6 core5 boundary frontier
        run: node scripts/analyze-pre-holy-frontier.mjs --max-expanded=25000 --max-generated=250000 --json > pre-holy-f6-boundary.json
      - name: Print compact boundary summary
        run: |
          python3 - <<'PY'
          import json
          r=json.load(open('pre-holy-f6-boundary.json')); s=r.get('solver') or {}
          print(f"BOUNDARY found={r.get('hasBoundaryStates')} exact={r.get('coverageExact')} verified={r.get('verifiedSeedCount')}/{r.get('seedCount')} stop={r.get('stoppedReason')} expanded={s.get('expandedStates')} generated={s.get('generatedStates')} goalStates={s.get('goalStructuralStates')} activeGoals={s.get('activeGoalLabels')} interpretation={r.get('interpretation')}")
          for x in (r.get('seeds') or [])[:12]:
              q=x.get('resources') or {}
              print(f"BOUNDARY_SEED cert={x.get('certificateHash')} steps={x.get('certificateSteps')} hp={q.get('hp')} atk={q.get('atk')} def={q.get('def')} gold={q.get('gold')} cards={q.get('sun')}/{q.get('moon')}/{q.get('star')} verified={x.get('verified')}")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: pre-holy-f6-boundary
          path: pre-holy-f6-boundary.json
          retention-days: 7

  staged-holy-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Run staged delayed-Holy proof
        run: node scripts/analyze-staged-holy-proof.mjs --boundary-max-expanded=25000 --boundary-max-generated=250000 --boundary-discovery-goals=512 --max-boundary-seeds=12 --core6-max-expanded=4000 --core6-max-generated=40000 --policy-max-expanded=8000 --policy-max-generated=80000 > staged-holy-proof.json
      - name: Print compact staged proof summary
        run: |
          python3 - <<'PY'
          import json
          r=json.load(open('staged-holy-proof.json')); b=r.get('boundary') or {}; c=r.get('core6') or {}; sched=r.get('seedSchedule') or {}
          print(f"STAGED_BOUNDARY found={b.get('hasBoundaryStates')} exact={b.get('coverageExact')} verified={b.get('verifiedSeedCount')}/{b.get('seedCount')} interpretation={b.get('interpretation')}")
          print(f"STAGED_SCHEDULE scheduler={sched.get('scheduler')} candidates={sched.get('candidateCount')} scheduled={sched.get('scheduledCount')}")
          for x in sched.get('diagnostics') or []:
              q=x.get('resources') or {}
              print(f"STAGED_SEED reason={x.get('selectionReason')} cert={x.get('certificateHash')} hp={q.get('hp')} atk={q.get('atk')} def={q.get('def')} gold={q.get('gold')} cards={q.get('sun')}/{q.get('moon')}/{q.get('star')} p={x.get('shopPurchases')} optMargin={x.get('optimisticBossMargin')} optWin={x.get('optimisticWinnable')} maxBuy={x.get('maxAffordablePurchases')}")
          print(f"STAGED_CORE6 reached={c.get('reached')} exactInfeasible={c.get('exactInfeasible')} scheduled={c.get('scheduledSeedCount')}/{c.get('verifiedSeedCount')} winner={c.get('winningBoundaryCertificateHash')} interpretation={c.get('interpretation')}")
          for x in r.get('policyResults') or []:
              s=x.get('solver') or {}; rp=x.get('replay') or {}
              print(f"STAGED_POLICY policy={x.get('holyPolicy')} feasible={x.get('feasible')} exact={x.get('exact')} stop={s.get('stoppedReason')} expanded={s.get('expandedStates')} generated={s.get('generatedStates')} replay={rp.get('ok')} interpretation={x.get('interpretation')}")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: staged-holy-proof
          path: staged-holy-proof.json
          retention-days: 7

  pre-holy-f6-stage:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/analyze-pre-holy-f6.mjs --max-expanded=25000 --max-generated=250000 --json > pre-holy-f6-stage.json
      - uses: actions/upload-artifact@v4
        with:
          name: pre-holy-f6-stage
          path: pre-holy-f6-stage.json
          retention-days: 7

  solver-diagnostic:
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        policy: [after-core-6, after-core-7, before-final]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Whole-policy constrained Solver comparison
        env: { HOLY_POLICY: '${{ matrix.policy }}' }
        run: node scripts/analyze-holy-policy-solver-seeds.mjs --policy="$HOLY_POLICY" --max-expanded=25000 --max-generated=250000 --json > "holy-policy-solver-seed-$HOLY_POLICY.json"
      - uses: actions/upload-artifact@v4
        with:
          name: holy-policy-solver-seed-${{ matrix.policy }}
          path: holy-policy-solver-seed-${{ matrix.policy }}.json
          retention-days: 7
