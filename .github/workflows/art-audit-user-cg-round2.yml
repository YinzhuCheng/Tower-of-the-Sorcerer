name: Import user CG round2

on:
  push:
    branches:
      - codex/alpha-standees-20260904
    paths:
      - '.art-upload/round2/READY'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: user-cg-round2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out target branch
        uses: actions/checkout@v4
        with:
          ref: codex/alpha-standees-20260904
          fetch-depth: 0

      - name: Decode reviewed CG payloads
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import hashlib
          import json
          from pathlib import Path

          root = Path('.')
          upload_root = root / '.art-upload/round2'
          manifest_path = upload_root / 'manifest.json'
          payload = json.loads(manifest_path.read_text(encoding='utf-8'))

          for item in payload['files']:
              encoded = ''.join((root / chunk).read_text(encoding='ascii').strip() for chunk in item['chunks'])
              data = base64.b64decode(encoded, validate=True)
              digest = hashlib.sha256(data).hexdigest()
              if digest != item['sha256']:
                  raise RuntimeError(f"sha256 mismatch for {item['id']}: {digest} != {item['sha256']}")
              target = root / item['target']
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(data)
              print(f"decoded {item['id']} -> {target} ({len(data)} bytes)")

          audit_manifest_path = root / 'art/visual-novel/05_manifests/art-audit-repair-v3-manifest.json'
          audit_manifest = json.loads(audit_manifest_path.read_text(encoding='utf-8'))
          indexed = {item['id']: item for item in audit_manifest['cgs']}
          for item in payload['files']:
              record = indexed[item['id']]
              if record['runtime'] != item['target']:
                  raise RuntimeError(f"runtime target mismatch for {item['id']}: {record['runtime']} != {item['target']}")
              record['sha256'] = item['sha256']
              record['profile'] = 'user-selected-round2-lighting-reference'
          audit_manifest['round2Import'] = {
              'date': '2026-09-11',
              'count': len(payload['files']),
              'policy': 'User-selected CG replacements; reference images guide rendering style only, not scene content.'
          }
          audit_manifest_path.write_text(json.dumps(audit_manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Validate repository tests
        run: npm test

      - name: Commit reviewed CG replacements
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/anime/cg art/visual-novel/05_manifests/art-audit-repair-v3-manifest.json
          git rm -r .art-upload/round2
          git commit -m "art: replace eight reviewed CGs with user-selected round2"
          git push origin HEAD:codex/alpha-standees-20260904
