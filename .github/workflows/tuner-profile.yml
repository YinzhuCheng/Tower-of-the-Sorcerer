name: Tuner Profile

on:
  push:
    branches:
      - solver-phase1-pareto
    paths:
      - 'src/tuner/**'
      - 'scripts/tune-shop-hp.mjs'
      - 'scripts/rank-numeric-levers.mjs'
      - 'scripts/synthesize-numeric-candidates.mjs'
      - 'test/shop-hp-tuner-*.test.js'
      - 'test/numeric-*.test.js'
      - '.github/workflows/tuner-profile.yml'
  pull_request:
    paths:
      - 'src/tuner/**'
      - 'scripts/tune-shop-hp.mjs'
      - 'scripts/rank-numeric-levers.mjs'
      - 'scripts/synthesize-numeric-candidates.mjs'
      - 'test/shop-hp-tuner-*.test.js'
      - 'test/numeric-*.test.js'
      - '.github/workflows/tuner-profile.yml'
  workflow_dispatch:

jobs:
  numeric-profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate legacy shop HP tuner report
        run: node scripts/tune-shop-hp.mjs --json > shop-hp-tuner-report.json
      - name: Generate general numeric lever report
        run: node scripts/rank-numeric-levers.mjs --top-k=16 --relative-step=0.10 --json > numeric-lever-report.json
      - name: Print concise lever summary
        run: node scripts/rank-numeric-levers.mjs --top-k=10 --relative-step=0.10
      - name: Synthesize and evaluate budgeted multi-parameter candidates
        run: node scripts/synthesize-numeric-candidates.mjs --top-k=16 --relative-step=0.10 --max-candidates=6 --edit-budget=0.30 --max-parameters=3 --evaluate --json > numeric-candidate-report.json
      - name: Print concise candidate summary
        run: node scripts/synthesize-numeric-candidates.mjs --top-k=16 --relative-step=0.10 --max-candidates=6 --edit-budget=0.30 --max-parameters=3 --evaluate
      - name: Upload shop HP report
        uses: actions/upload-artifact@v4
        with:
          name: shop-hp-tuner-report
          path: shop-hp-tuner-report.json
          if-no-files-found: error
          retention-days: 7
      - name: Upload numeric lever report
        uses: actions/upload-artifact@v4
        with:
          name: numeric-lever-report
          path: numeric-lever-report.json
          if-no-files-found: error
          retention-days: 7
      - name: Upload numeric candidate report
        uses: actions/upload-artifact@v4
        with:
          name: numeric-candidate-report
          path: numeric-candidate-report.json
          if-no-files-found: error
          retention-days: 7
