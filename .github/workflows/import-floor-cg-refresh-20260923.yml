name: Import floor CG refresh 2026-09-23

on:
  push:
    branches:
      - main
    paths:
      - '.art-upload/floor-cg-refresh/source-url.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: floor-cg-refresh-20260923-${{ github.ref }}
  cancel-in-progress: false

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download CG refresh archive
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_URL="$(tr -d '\r\n' < .art-upload/floor-cg-refresh/source-url.txt)"
          test -n "$SOURCE_URL"
          curl --fail --location --retry 3 --retry-delay 2 "$SOURCE_URL" -o /tmp/tower-floor-cg-refresh.zip
          rm -rf /tmp/tower-floor-cg-refresh
          mkdir -p /tmp/tower-floor-cg-refresh
          unzip -q /tmp/tower-floor-cg-refresh.zip -d /tmp/tower-floor-cg-refresh
          test -f /tmp/tower-floor-cg-refresh/transfer_manifest.json

      - name: Install runtime and source art
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import shutil
          from pathlib import Path

          root = Path('.')
          source = Path('/tmp/tower-floor-cg-refresh')
          payload = json.loads((source / 'transfer_manifest.json').read_text(encoding='utf-8'))

          for item in payload['files']:
              src = source / item['archive']
              if not src.is_file():
                  raise RuntimeError(f"missing archive member for {item['id']}: {item['archive']}")
              data = src.read_bytes()
              digest = hashlib.sha256(data).hexdigest()
              if digest != item['sha256']:
                  raise RuntimeError(f"sha256 mismatch for {item['id']}: {digest} != {item['sha256']}")
              target = root / item['target']
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(data)
              print(f"installed {item['id']} -> {target} ({len(data)} bytes)")

          source_by_id = {
              'missing-fourth-step': next(i for i in payload['files'] if i['id'] == 'missing-fourth-step-source'),
              'seventeen-minute-splice': next(i for i in payload['files'] if i['id'] == 'seventeen-minute-splice-source'),
              'intercepted-receipt': next(i for i in payload['files'] if i['id'] == 'intercepted-receipt-source'),
              'echo-ledger': next(i for i in payload['files'] if i['id'] == 'echo-ledger-source'),
          }
          runtime_by_id = {
              item['id']: item
              for item in payload['files']
              if not item.get('sourceMaster')
          }

          current_path = root / 'art/visual-novel/05_manifests/cg-current-best-20260921-v1.json'
          current = json.loads(current_path.read_text(encoding='utf-8'))
          ids = {
              'CG_009_missing-fourth-step': 'missing-fourth-step',
              'CG_010_seventeen-minute-splice': 'seventeen-minute-splice',
              'CG_011_intercepted-receipt': 'intercepted-receipt',
              'CG_012_echo-ledger': 'echo-ledger',
          }
          for record in current['scenes']:
              short = ids.get(record['cg_id'])
              if not short:
                  continue
              src = source_by_id[short]
              run = runtime_by_id[short]
              record['current_stage'] = 'R4'
              record['path'] = src['target']
              record['sha256'] = src['sha256']
              if record['runtime_target'] != run['target']:
                  raise RuntimeError(f"runtime target mismatch for {short}: {record['runtime_target']} != {run['target']}")
          current['version'] = 'handoff-2026-09-23-floor-cg-refresh-v2'
          current['status'] = 'current best source for all 19 active CGs; floor 11/17/18/19 refreshed after environment redraw'
          current_path.write_text(json.dumps(current, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          audit_path = root / 'art/visual-novel/05_manifests/art-audit-repair-v3-manifest.json'
          audit = json.loads(audit_path.read_text(encoding='utf-8'))
          for record in audit.get('cgs', []):
              short = record.get('id')
              if short not in {'missing-fourth-step', 'intercepted-receipt', 'echo-ledger'}:
                  continue
              run = runtime_by_id[short]
              src = source_by_id[short]
              if record.get('runtime') != run['target']:
                  raise RuntimeError(f"audit runtime target mismatch for {short}")
              record['sha256'] = run['sha256']
              record['sourceFrom'] = src['target']
              record['profile'] = 'floor-cg-refresh-2026-09-23'
          audit['floorCgRefresh'] = {
              'date': '2026-09-23',
              'runtimeCount': 4,
              'sourceMasterCount': 4,
              'policy': 'Redraw floor 11/17/18/19 story CGs against the refreshed floor-specific interior environments while preserving approved character identities.'
          }
          audit_path.write_text(json.dumps(audit, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          release_manifest = {
              'version': payload['version'],
              'status': 'runtime-ready',
              'assets': payload['files'],
          }
          release_path = root / 'art/visual-novel/05_manifests/floor-cg-refresh-20260923-manifest.json'
          release_path.write_text(json.dumps(release_manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Validate art bindings
        run: |
          node --test --test-concurrency=1 test/art-audit-page.test.js test/art-audit-repair-v3.test.js test/story-art-v8-assets.test.js
          npm run build

      - name: Commit refreshed CGs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/anime/cg \
            art/visual-novel/04_cg/final/2026-09-23-floor-cg-refresh \
            art/visual-novel/05_manifests/cg-current-best-20260921-v1.json \
            art/visual-novel/05_manifests/art-audit-repair-v3-manifest.json \
            art/visual-novel/05_manifests/floor-cg-refresh-20260923-manifest.json
          git rm -r .art-upload/floor-cg-refresh
          git commit -m "art: refresh floor 11 17 18 19 story CGs"
          git push origin HEAD:main
