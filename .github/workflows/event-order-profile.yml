name: Event Order Profile

on:
  push:
    branches:
      - solver-phase1-pareto
    paths:
      - 'src/solver/fixed-purchase-policy-adapter.js'
      - 'src/solver/core-boundary-adapter.js'
      - 'src/solver/objective-threshold-adapter.js'
      - 'src/solver/tower-bounds.js'
      - 'src/solver/replay.js'
      - 'src/analyzer/event-order-best-response.js'
      - 'src/analyzer/event-order-suffix-response.js'
      - 'src/analyzer/event-order-threshold-proof.js'
      - 'src/analyzer/event-order-core-transition-proof.js'
      - 'src/tuner/review-candidates.js'
      - 'scripts/analyze-event-order-response.mjs'
      - 'scripts/analyze-event-order-suffix.mjs'
      - 'scripts/prove-event-order-threshold.mjs'
      - 'scripts/analyze-event-order-core-transition.mjs'
      - 'test/fixed-purchase-policy-adapter.test.js'
      - 'test/fixed-purchase-bound.test.js'
      - 'test/fractional-harvest-bound.test.js'
      - 'test/core-boundary-adapter.test.js'
      - 'test/objective-threshold-adapter.test.js'
      - 'test/tower-bounds-overlay.test.js'
      - 'test/replay-compact-bridge.test.js'
      - 'docs/event-order-best-response.md'
      - '.github/workflows/event-order-profile.yml'
  pull_request:
    paths:
      - 'src/solver/fixed-purchase-policy-adapter.js'
      - 'src/solver/core-boundary-adapter.js'
      - 'src/solver/objective-threshold-adapter.js'
      - 'src/solver/tower-bounds.js'
      - 'src/solver/replay.js'
      - 'src/analyzer/event-order-best-response.js'
      - 'src/analyzer/event-order-suffix-response.js'
      - 'src/analyzer/event-order-threshold-proof.js'
      - 'src/analyzer/event-order-core-transition-proof.js'
      - 'src/tuner/review-candidates.js'
      - 'scripts/analyze-event-order-response.mjs'
      - 'scripts/analyze-event-order-suffix.mjs'
      - 'scripts/prove-event-order-threshold.mjs'
      - 'scripts/analyze-event-order-core-transition.mjs'
      - 'test/fixed-purchase-policy-adapter.test.js'
      - 'test/fixed-purchase-bound.test.js'
      - 'test/fractional-harvest-bound.test.js'
      - 'test/core-boundary-adapter.test.js'
      - 'test/objective-threshold-adapter.test.js'
      - 'test/tower-bounds-overlay.test.js'
      - 'test/replay-compact-bridge.test.js'
      - 'docs/event-order-best-response.md'
      - '.github/workflows/event-order-profile.yml'
  workflow_dispatch:
    inputs:
      max_expanded:
        description: 'Whole-game optimize expansion budget'
        required: false
        default: '12000'
      max_generated:
        description: 'Whole-game generated-action budget'
        required: false
        default: '180000'
      threshold_max_expanded:
        description: 'Deep threshold-proof expansion budget'
        required: false
        default: '50000'
      threshold_max_generated:
        description: 'Deep threshold-proof generated-action budget'
        required: false
        default: '400000'

concurrency:
  group: event-order-profile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fixed-purchase-event-order:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Analyze whole-game event-order best response
        env:
          MAX_EXPANDED: ${{ inputs.max_expanded || '12000' }}
          MAX_GENERATED: ${{ inputs.max_generated || '180000' }}
        run: |
          node scripts/analyze-event-order-response.mjs --max-expanded="$MAX_EXPANDED" --max-generated="$MAX_GENERATED" --json > event-order-response.json
      - name: Print compact event-order summary
        run: |
          python3 - <<'PY'
          import json
          r=json.load(open('event-order-response.json')); s=r.get('solver') or {}; o=s.get('objective') or {}; e=r.get('exploit') or {}; p=s.get('profile') or {}
          print(f"EVENT_ORDER status={r.get('status')} exact={r.get('coverageExact')} exploit={r.get('exploitFound')} referenceHp={(r.get('reference') or {}).get('terminalHp')} searchBest={o.get('searchBest')} best={o.get('best')} stop={s.get('stoppedReason')}")
          print(f"SEARCH expanded={s.get('expandedStates')} generated={s.get('generatedStates')} structural={s.get('structuralStates')} active={s.get('activeLabels')} dominated={s.get('prunedDominated')} bound={s.get('prunedBound')}")
          print(f"EXPLOIT deltaHp={e.get('deltaHp')} gain={e.get('relativeGain')} replay={e.get('replayOk')} cert={e.get('certificateHash')}")
          print('STAGES ' + ','.join(f"{k}:{v}" for k,v in sorted((p.get('expandedByStage') or {}).items(), key=lambda x:-x[1])[:20]))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: event-order-response
          path: event-order-response.json
          retention-days: 7

  fixed-purchase-threshold-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Prove or refute a whole-game event-order exploit above the reference
        env:
          MAX_EXPANDED: ${{ inputs.threshold_max_expanded || '50000' }}
          MAX_GENERATED: ${{ inputs.threshold_max_generated || '400000' }}
        run: |
          node scripts/prove-event-order-threshold.mjs --max-expanded="$MAX_EXPANDED" --max-generated="$MAX_GENERATED" --json > event-order-threshold-proof.json
      - name: Print compact threshold proof summary
        run: |
          python3 - <<'PY'
          import json
          r=json.load(open('event-order-threshold-proof.json')); s=r.get('solver') or {}; p=s.get('profile') or {}; e=r.get('exploit') or {}
          print(f"THRESHOLD_PROOF status={r.get('status')} exactNoExploit={r.get('exactNoExploit')} exploit={r.get('exploitFound')} threshold={(r.get('threshold') or {}).get('strictGreaterThan')} stop={s.get('stoppedReason')}")
          print(f"SEARCH expanded={s.get('expandedStates')} generated={s.get('generatedStates')} structural={s.get('structuralStates')} active={s.get('activeLabels')} dominated={s.get('prunedDominated')} bound={s.get('prunedBound')}")
          print(f"EXPLOIT hp={e.get('terminalHp')} delta={e.get('deltaHp')} replay={e.get('replayOk')} cert={e.get('certificateHash')}")
          print('STAGES ' + ','.join(f"{k}:{v}" for k,v in sorted((p.get('expandedByStage') or {}).items(), key=lambda x:-x[1])[:20]))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: event-order-threshold-proof
          path: event-order-threshold-proof.json
          retention-days: 7

  threshold-core-transition:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Analyze threshold-relevant c6 to c7 transition
        run: |
          node scripts/analyze-event-order-core-transition.mjs \
            --from-cores=6 \
            --to-cores=7 \
            --boundary-max-expanded=8000 \
            --boundary-max-generated=100000 \
            --boundary-max-goals=64 \
            --max-transition-seeds=8 \
            --transition-max-expanded=5000 \
            --transition-max-generated=70000 \
            --json > event-order-core6-to-core7.json
      - name: Print compact transition summary
        run: |
          python3 - <<'PY'
          import json
          r=json.load(open('event-order-core6-to-core7.json')); b=r.get('boundary') or {}; sc=r.get('schedule') or {}
          print(f"CORE_TRANSITION status={r.get('status')} found={r.get('transitionFound')} exactNo={r.get('exactNoTransition')} transition=c{r.get('fromCores')}->c{r.get('toCores')} threshold={(r.get('threshold') or {}).get('strictGreaterThan')}")
          print(f"BOUNDARY relevant={b.get('verifiedRelevantGoals')}/{b.get('discoveredGoals')} exact={b.get('coverageExact')} expanded={b.get('expandedStates')} generated={b.get('generatedStates')} stop={b.get('stoppedReason')}")
          print(f"SCHEDULE relevant={sc.get('verifiedRelevantSeedCount')} scheduled={sc.get('scheduledSeedCount')}")
          for a in r.get('attempts') or []:
              s=a.get('solver') or {}; rp=a.get('replay') or {}
              print(f"TRANSITION seed={a.get('prefixCertificateHash')} ub={a.get('prefixUpperBound')} hp={(a.get('prefixResources') or {}).get('hp')} gold={(a.get('prefixResources') or {}).get('gold')} p={a.get('prefixShopPurchases')} found={a.get('transitionFound')} exactNo={a.get('exactNoTransition')} expanded={s.get('expandedStates')} generated={s.get('generatedStates')} bound={s.get('prunedBound')} stop={s.get('stoppedReason')} nextUb={rp.get('nextStateUpperBound')}")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: event-order-core6-to-core7
          path: event-order-core6-to-core7.json
          retention-days: 7

  staged-core-suffix-event-order:
    strategy:
      fail-fast: false
      matrix:
        target_cores: [6, 7]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Discover threshold-relevant core boundary and analyze suffix
        env:
          TARGET_CORES: ${{ matrix.target_cores }}
        run: |
          node scripts/analyze-event-order-suffix.mjs \
            --target-cores="$TARGET_CORES" \
            --boundary-max-expanded=6000 \
            --boundary-max-generated=70000 \
            --boundary-max-goals=32 \
            --max-suffix-seeds=4 \
            --suffix-max-expanded=2500 \
            --suffix-max-generated=35000 \
            --json > "event-order-core${TARGET_CORES}-suffix.json"
      - name: Print compact suffix summary
        env:
          TARGET_CORES: ${{ matrix.target_cores }}
        run: |
          python3 - <<'PY'
          import json,os
          c=os.environ['TARGET_CORES']; r=json.load(open(f'event-order-core{c}-suffix.json')); b=r.get('boundary') or {}; e=r.get('exploit') or {}
          print(f"CORE_SUFFIX core={c} status={r.get('status')} exploit={r.get('exploitFound')} exact={r.get('coverageExact')} referenceHp={(r.get('reference') or {}).get('terminalHp')}")
          print(f"BOUNDARY verified={b.get('verifiedGoals')}/{b.get('discoveredGoals')} exact={b.get('coverageExact')} expanded={b.get('expandedStates')} generated={b.get('generatedStates')} stop={b.get('stoppedReason')}")
          for a in r.get('attempts') or []:
              s=a.get('suffix') or {}; o=s.get('objective') or {}
              print(f"SUFFIX prefix={a.get('prefixCertificateHash')} ub={a.get('optimisticTerminalHpUpperBound')} hp={(a.get('bridgeResources') or {}).get('hp')} gold={(a.get('bridgeResources') or {}).get('gold')} p={a.get('bridgeShopPurchases')} best={o.get('searchBest')} exact={s.get('exact')} stop={s.get('stoppedReason')} replay={(a.get('suffixReplay') or {}).get('ok')} exploit={a.get('exploit')} exactNoExploit={a.get('exactNoExploit')}")
          print(f"EXPLOIT terminalHp={e.get('terminalHp')} delta={e.get('deltaHp')} gain={e.get('relativeGain')}")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: event-order-core${{ matrix.target_cores }}-suffix
          path: event-order-core${{ matrix.target_cores }}-suffix.json
          retention-days: 7
