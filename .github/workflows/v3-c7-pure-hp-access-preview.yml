name: V3 C7 Pure HP Access Preview

on:
  push:
    branches:
      - solver-phase1-pareto
    paths:
      - 'src/solver/relaxed-pure-hp-access-bound.js'
      - 'src/solver/fixed-purchase-bound-diagnostics.js'
      - 'src/solver/tower-bounds.js'
      - 'src/solver/fixed-purchase-policy-adapter.js'
      - 'src/analyzer/event-order-core-bridge-access-bound-preview.js'
      - 'src/analyzer/event-order-core-bridge-bound-diagnostics.js'
      - 'src/tuner/review-candidate-v3-rebuild.js'
      - 'src/tuner/review-candidates.js'
      - 'scripts/analyze-v3-c7-pure-hp-access-bound-preview.mjs'
      - 'test/relaxed-pure-hp-access-bound.test.js'
      - 'docs/v3-pure-hp-access-bound-preview.md'
      - 'docs/v3-c7-bound-result-2026-08-26.md'
      - '.github/workflows/v3-c7-pure-hp-access-preview.yml'
  pull_request:
    paths:
      - 'src/solver/relaxed-pure-hp-access-bound.js'
      - 'src/solver/fixed-purchase-bound-diagnostics.js'
      - 'src/solver/tower-bounds.js'
      - 'src/solver/fixed-purchase-policy-adapter.js'
      - 'src/analyzer/event-order-core-bridge-access-bound-preview.js'
      - 'src/analyzer/event-order-core-bridge-bound-diagnostics.js'
      - 'src/tuner/review-candidate-v3-rebuild.js'
      - 'src/tuner/review-candidates.js'
      - 'scripts/analyze-v3-c7-pure-hp-access-bound-preview.mjs'
      - 'test/relaxed-pure-hp-access-bound.test.js'
      - 'docs/v3-pure-hp-access-bound-preview.md'
      - 'docs/v3-c7-bound-result-2026-08-26.md'
      - '.github/workflows/v3-c7-pure-hp-access-preview.yml'
  workflow_dispatch:

concurrency:
  group: v3-c7-pure-hp-access-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  access-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Preview pure-HP access tightening on representative c7 bridges
        run: |
          node scripts/analyze-v3-c7-pure-hp-access-bound-preview.mjs \
            --from-cores=6 \
            --to-cores=7 \
            --from-boundary-max-expanded=8000 \
            --from-boundary-max-generated=100000 \
            --from-boundary-max-goals=64 \
            --bridge-max-expanded=6000 \
            --bridge-max-generated=90000 \
            --bridge-max-goals=32 \
            --json > v3-c7-pure-hp-access-preview.json
      - name: Print pure-HP access preview
        if: always()
        run: |
          python3 - <<'PY'
          import json, os
          path='v3-c7-pure-hp-access-preview.json'
          if not os.path.exists(path) or os.path.getsize(path) == 0:
              print('V3 pure-HP access preview report was not produced.')
              raise SystemExit(0)
          x=json.load(open(path)); r=x.get('analysis') or {}
          print(f"V3_ACCESS status={r.get('status')} reference={(x.get('rebuild') or {}).get('terminalHp')} semantic={(x.get('rebuild') or {}).get('semanticFingerprint')} proofModified={r.get('proofBoundModified')} maxTightening={r.get('maxPreviewTightening')} prunableReps={r.get('previewPrunableRepresentativeCount')}")
          for e in r.get('representatives') or []:
              p=e.get('accessPreview') or {}; best=p.get('best') or {}; c=best.get('strongestConstraint') or {}; res=e.get('resources') or {}
              print(f"BRIDGE role={e.get('role')} p={e.get('shopPurchases')} hp={res.get('hp')} gold={res.get('gold')} cards={res.get('sun')}/{res.get('moon')}/{res.get('star')} old={e.get('oldUpperBound')} oldSlack={e.get('oldThresholdSlack')} preview={e.get('previewUpperBound')} tightening={e.get('tightening')} previewSlack={e.get('previewThresholdSlack')} prune={e.get('previewWouldPruneThreshold')} oldMatch={e.get('oldBoundExactMatch')}")
              for item in p.get('items') or []:
                  print(f"  HP_ITEM id={item.get('itemId')} xy={item.get('x')},{item.get('y')} credit={item.get('creditedObjectiveHp')} accessDamageLB={item.get('accessDamageLowerBound')}")
              print(f"  BEST buys={best.get('purchaseCount')} old={best.get('oldUpperBound')} harvest={best.get('harvestDamageLowerBound')} item={c.get('itemId')}@{c.get('x')},{c.get('y')} access={c.get('accessDamageLowerBound')} beyondHarvest={c.get('accessBeyondHarvest')} penalty={best.get('additionalPenalty')} preview={best.get('previewUpperBound')}")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v3-c7-pure-hp-access-preview
          path: v3-c7-pure-hp-access-preview.json
          if-no-files-found: warn
          retention-days: 14
