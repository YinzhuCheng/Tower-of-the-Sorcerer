name: 10F Co-design Profile
on:
  push:
    branches: [demo-10-floor-codesign]
    paths:
      - 'src/analyzer/demo-10-floor-checkpoints.js'
      - 'src/tuner/demo-10-floor-adaptive-mutations.js'
      - 'src/tuner/demo-10-floor-mutations.js'
      - 'src/tuner/demo-10-floor-topology-validator.js'
      - 'src/tuner/demo-10-floor-topology-mutations.js'
      - 'src/tuner/codesign-beam-search.js'
      - 'src/tuner/prunability-score.js'
      - 'src/solver/greedy-strategy.js'
      - 'src/game/demo-10-floor-content.js'
      - 'src/game/demo-10-floor-quality.js'
      - 'scripts/search-demo-10f-codesign.mjs'
      - 'scripts/search-demo-10f-topology.mjs'
      - 'test/codesign-beam-search.test.js'
      - 'test/demo-10-floor-adaptive-mutations.test.js'
      - 'test/demo-10-floor-checkpoints.test.js'
      - 'test/demo-10-floor-mutations.test.js'
      - 'test/demo-10-floor-topology.test.js'
      - 'test/greedy-checkpoint-telemetry.test.js'
      - 'package.json'
      - '.github/workflows/demo-10-floor-codesign.yml'
  pull_request:
    paths:
      - 'src/analyzer/demo-10-floor-checkpoints.js'
      - 'src/tuner/demo-10-floor-adaptive-mutations.js'
      - 'src/tuner/demo-10-floor-mutations.js'
      - 'src/tuner/demo-10-floor-topology-validator.js'
      - 'src/tuner/demo-10-floor-topology-mutations.js'
      - 'src/tuner/codesign-beam-search.js'
      - 'src/tuner/prunability-score.js'
      - 'src/solver/greedy-strategy.js'
      - 'src/game/demo-10-floor-content.js'
      - 'src/game/demo-10-floor-quality.js'
      - 'scripts/search-demo-10f-codesign.mjs'
      - 'scripts/search-demo-10f-topology.mjs'
      - 'test/codesign-beam-search.test.js'
      - 'test/demo-10-floor-adaptive-mutations.test.js'
      - 'test/demo-10-floor-checkpoints.test.js'
      - 'test/demo-10-floor-mutations.test.js'
      - 'test/demo-10-floor-topology.test.js'
      - 'test/greedy-checkpoint-telemetry.test.js'
      - 'package.json'
      - '.github/workflows/demo-10-floor-codesign.yml'
  workflow_dispatch:

concurrency:
  group: demo-10f-codesign-${{ github.ref }}
  cancel-in-progress: true

jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Preserve repository regression suite
        run: npm run check
      - name: Preserve 10F v1 quality contract
        run: npm run validate:demo10
      - name: Search evidence-driven 10F setter neighborhood
        run: npm run search:demo10:codesign
      - name: Search constrained F8/F9 topology neighborhood
        run: npm run search:demo10:topology
