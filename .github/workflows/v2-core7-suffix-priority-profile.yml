name: V2 Core7 Suffix Priority Sweep

on:
  push:
    branches:
      - solver-phase1-pareto
    paths:
      - 'src/solver/late-game-threshold-priority-adapter.js'
      - 'src/analyzer/event-order-core-transition-chain.js'
      - 'scripts/analyze-v2-event-order-core-transition-chain.mjs'
      - 'test/late-game-threshold-priority-adapter.test.js'
      - 'test/event-order-core-transition-chain.test.js'
      - 'docs/v2-core7-suffix-priority.md'
      - '.github/workflows/v2-core7-suffix-priority-profile.yml'
  pull_request:
    paths:
      - 'src/solver/late-game-threshold-priority-adapter.js'
      - 'src/analyzer/event-order-core-transition-chain.js'
      - 'scripts/analyze-v2-event-order-core-transition-chain.mjs'
      - 'test/late-game-threshold-priority-adapter.test.js'
      - 'test/event-order-core-transition-chain.test.js'
      - 'docs/v2-core7-suffix-priority.md'
      - '.github/workflows/v2-core7-suffix-priority-profile.yml'
  workflow_dispatch:
    inputs:
      suffix_max_expanded:
        description: 'Per-profile c7 terminal suffix expansion budget'
        required: false
        default: '8000'
      suffix_max_generated:
        description: 'Per-profile c7 terminal suffix generated-action budget'
        required: false
        default: '100000'

concurrency:
  group: v2-core7-suffix-priority-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suffix-priority-sweep:
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile_name: baseline
            priority_mode: baseline
            slack_bucket: '25'
          - profile_name: threshold-b25
            priority_mode: late-game-threshold
            slack_bucket: '25'
          - profile_name: threshold-b100
            priority_mode: late-game-threshold
            slack_bucket: '100'
          - profile_name: threshold-b250
            priority_mode: late-game-threshold
            slack_bucket: '250'
          - profile_name: threshold-b500
            priority_mode: late-game-threshold
            slack_bucket: '500'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Run V2 c7 terminal suffix profile
        env:
          PROFILE_NAME: ${{ matrix.profile_name }}
          PRIORITY_MODE: ${{ matrix.priority_mode }}
          SUFFIX_MAX_EXPANDED: ${{ inputs.suffix_max_expanded || '8000' }}
          SUFFIX_MAX_GENERATED: ${{ inputs.suffix_max_generated || '100000' }}
          SLACK_BUCKET: ${{ matrix.slack_bucket }}
        run: |
          node scripts/analyze-v2-event-order-core-transition-chain.mjs \
            --from-cores=6 \
            --to-cores=7 \
            --boundary-max-expanded=8000 \
            --boundary-max-generated=100000 \
            --boundary-max-goals=64 \
            --max-transition-seeds=8 \
            --transition-max-expanded=5000 \
            --transition-max-generated=70000 \
            --suffix-max-expanded="$SUFFIX_MAX_EXPANDED" \
            --suffix-max-generated="$SUFFIX_MAX_GENERATED" \
            --suffix-priority="$PRIORITY_MODE" \
            --suffix-priority-slack-bucket="$SLACK_BUCKET" \
            --json > "v2-core7-suffix-${PROFILE_NAME}.json"
      - name: Print comparable suffix telemetry
        env:
          PROFILE_NAME: ${{ matrix.profile_name }}
          PRIORITY_MODE: ${{ matrix.priority_mode }}
          SLACK_BUCKET: ${{ matrix.slack_bucket }}
        run: |
          python3 - <<'PY'
          import json, os
          profile=os.environ['PROFILE_NAME']
          mode=os.environ['PRIORITY_MODE']
          bucket=os.environ['SLACK_BUCKET']
          x=json.load(open(f'v2-core7-suffix-{profile}.json')); r=x.get('chain') or {}; s=(r.get('suffix') or {}).get('solver') or {}; t=s.get('telemetry') or {}; e=r.get('exploit') or {}
          print(f"V2_CORE7 profile={profile} mode={mode} bucket={bucket} status={r.get('status')} exploit={r.get('exploitFound')} exactNo={r.get('exactNoExploit')}")
          print(f"SEARCH expanded={s.get('expandedStates')} generated={s.get('generatedStates')} structural={s.get('structuralStates')} bound={s.get('prunedBound')} queuePeak={(s.get('profile') or {}).get('queuePeak')} stop={s.get('stoppedReason')}")
          print(f"TRAVEL generated={t.get('travelGenerated')} ratio={t.get('travelGeneratedRatio')} teleport={t.get('teleportGenerated')} stairs={t.get('stairGenerated')}")
          print(f"LATE_FLOORS from={t.get('lateFloorFrom')} expanded={t.get('lateFloorExpanded')} ratio={t.get('lateFloorExpandedRatio')} earlier={t.get('earlierFloorExpanded')} earlierRatio={t.get('earlierFloorExpandedRatio')}")
          print(f"EXPLOIT hp={e.get('terminalHp')} delta={e.get('deltaHp')} replay={(e.get('witnessReplay') or {}).get('ok')} semantic={(e.get('witness') or {}).get('semanticFingerprint')}")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: v2-core7-suffix-${{ matrix.profile_name }}
          path: v2-core7-suffix-${{ matrix.profile_name }}.json
          retention-days: 14
