name: Reconstruct reviewed art transport
on:
  push:
    branches: [transport/reviewed-art-20260930]
    paths: [.release-transport/materials-r1/READY]
permissions:
  contents: write
concurrency:
  group: reviewed-art-transport-20260930
  cancel-in-progress: false
jobs:
  reconstruct:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify approved texture manifest
        run: echo "0df9f20563579d5c0aeb5ea9363f22ea0b75739c6e5dc002202e1136acc4a27a  .release-transport/materials-r1/manifest.json" | sha256sum --check --strict
      - name: Install pinned complete-image decoder
        run: python -m pip install Pillow==12.3.0
      - name: Verify and retain six ordinary texture blobs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python .release-transport/materials-r1/retain.py
          echo "Six preview texture blobs decoded and checksum-verified. Main and workflow subtree unchanged." >> "$GITHUB_STEP_SUMMARY"
