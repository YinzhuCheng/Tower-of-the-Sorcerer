name: Reconstruct and review painted scene assets
on:
  push:
    branches: [transport/reviewed-art-20260930]
    paths: [.release-transport/painted-viewports-r2/READY]
permissions:
  contents: write
concurrency:
  group: reviewed-art-transport-20260930
  cancel-in-progress: false
jobs:
  reconstruct-and-review:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact bounded transport inputs
        run: |
          echo '60db00981ee8e55681ae1a929cf9b99dba4681bb3d4f5aa9dbab7c0fe3569d4d  .release-transport/painted-viewports-r2/manifest.json' | sha256sum --check --strict
          echo '463f105180847991486070c3d5636eb2a3ffe7ac577512ad98893dd568215640  .release-transport/painted-viewports-r2/retain-and-prepare.py' | sha256sum --check --strict
      - name: Install pinned complete-image decoder
        run: python -m pip install Pillow==12.3.0
      - name: Decode original art and retain ordinary blobs only on temporary branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python .release-transport/painted-viewports-r2/retain-and-prepare.py
      - name: Test the frozen self-contained viewport
        working-directory: .release-transport/painted-viewports-r2/app
        run: npm test
      - name: Check official Chrome and install Chinese fonts
        run: |
          google-chrome --version
          sudo apt-get update
          sudo apt-get install --yes fonts-noto-cjk
      - name: Install integrity-pinned official Playwright core without install scripts
        run: npm ci --ignore-scripts --prefix .release-transport/painted-viewports-r2/tooling
      - name: Capture actual desktop and narrow viewports with normal sandbox
        working-directory: .release-transport/painted-viewports-r2/app
        env:
          REVIEW_BROWSER_CI: '1'
        run: |
          export PLAYWRIGHT_MODULE="$GITHUB_WORKSPACE/.release-transport/painted-viewports-r2/tooling/node_modules/playwright-core/index.mjs"
          export CHROMIUM_EXECUTABLE="$(command -v google-chrome)"
          node scripts/capture-playwright.mjs
      - name: Split actual evidence below the supported transfer limit
        if: always()
        run: |
          echo '9c9f065c2ffc1adfe1e9fb3724a2cff84440bdcfa7f337ca4f06ee9ab0c2865e  .release-transport/painted-viewports-r2/split-evidence.py' | sha256sum --check --strict
          python .release-transport/painted-viewports-r2/split-evidence.py
      - name: Retain real browser evidence shard 00
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: painted-r2-shard00-${{ github.sha }}
          path: .release-transport/painted-viewports-r2/evidence-shards/00/
          if-no-files-found: ignore
          retention-days: 14
      - name: Retain real browser evidence shard 01
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: painted-r2-shard01-${{ github.sha }}
          path: .release-transport/painted-viewports-r2/evidence-shards/01/
          if-no-files-found: ignore
          retention-days: 14
