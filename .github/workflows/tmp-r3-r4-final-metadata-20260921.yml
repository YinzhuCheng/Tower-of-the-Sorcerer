name: Temporary R3 R4 Final Metadata Publish

on:
  push:
    branches:
      - tmp/r3-r4-final-metadata-20260921

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          lfs: true
          fetch-depth: 0

      - name: Generate final QA and manifests
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, hashlib
          from pathlib import Path

          root = Path('art/visual-novel')
          r3dir = root / '04_cg/working/R3-scene/2026-09-21'
          qadir = root / '03_intermediate/qa/2026-09-21-r3-r4-final'
          mandir = root / '05_manifests'
          qadir.mkdir(parents=True, exist_ok=True)
          mandir.mkdir(parents=True, exist_ok=True)

          notes = {
            'CG_001_critical': 'R3: single hero, conscious, right-hand sword support, no enemy. R4: hands/legs/face/edges clean; no pseudo-text/watermark.',
            'CG_002_defeat': 'R3: exhausted but conscious, safe silhouette, sword on character-right side, no enemy. R4: anatomy and edges clean; no sexualized damage/text.',
            'CG_003_prologue-tower': 'R3 previously accepted: tower-dominant storm shot, hero small/back-facing, seven restrained core lights. R4: architecture/weather/lighting clean.',
            'CG_004_seven-cantos-severed': 'R3: exactly seven separated light segments and exactly three queen seal tablets; hero conscious. R4: faces/hands/energy edges clean; counts readable.',
            'CG_005_northstar-arrival': 'R3: five-string shell harp, human legs, calm evidence water mirror with distant ship/harbor lights. R4: hand/string region inspected; no readable text or extra instrument.',
            'CG_006_seven-core-network': 'R3 previously accepted: exactly seven paths, one shared lock, shadow-boss owns needle/spool. R4: anatomy/lighting/edges clean; no readable UI.',
            'CG_007_noctia-truth': 'R3: non-attacking dialogue, lowered hero sword, queen sorrow/fading distress light, low throne. R4: cast identity and anatomy clean; no extra props/text.',
            'CG_008_noctia-seal': 'R3: cooperation clear; exactly seven cores, exactly three seal tablets, central gap readable. R4: count crop inspected; faces unobscured, no queen sword/text.',
            'CG_009_missing-fourth-step': 'R3 previously accepted: exactly four positions with fourth missing, queen hand stops before gap. R4: no text/UI/anatomy defect.',
            'CG_010_seventeen-minute-splice': 'R3 previously accepted: three evidence columns, two shift together, one remains original. R4: hands/astrolabe/lighting clean; no readable text.',
            'CG_011_intercepted-receipt': 'R3: interceptor clearly nonhuman mechanism, receipt visibly attached to chest, shadow-boss controls line. R4: mechanism/anatomy/edges clean; no readable letter/extra weapons.',
            'CG_012_echo-ledger': 'R3: three witnesses, one green status light, single tag/evidence, black ledger beside regent. R4: hands/face/props clean; no duplicate books or pseudo-text.',
            'CG_013_noctia-sovereign': 'R3: sovereign male, right hand presents cracked signet, blue broken restraint on same wrist, three witnesses. R4: hands/ring/restraint clean; no extra rings/text.',
            'CG_014_missing-page-restored': 'R3 previously accepted: one missing final page, clean mechanical separation, three witnesses. R4: anatomy/page edges/lighting clean; no readable legal text.',
            'CG_015_letters-held-in-storm': 'R3: cooperative windbreak, ordered letters pinned down, queen crown retained, paper flow clear and faces unobscured. R4: hands/fabric/rain/edges clean; no text/watermark.',
            'CG_016_originals-enter-lighthouse': 'R3: four characters, hero leads track, queen+sovereign share heavy source volume, custodian operates rear key station. R4: cast/anatomy/depth/lighting clean; no random books/text.',
            'CG_017_traceable-revocation': 'R3 previously accepted: guide owns light pen and full-ring astrolabe; old/new record layers coexist; three characters. R4: anatomy clean; holographic marks remain abstract/non-readable.',
            'CG_018_noctia-afterlight': 'Accepted without rerender from the R2 bytes after direct R3/R4 inspection: quiet pause, one alarm stone, mail crate between pair, final volume foreground, queen crown preserved; hands/stone/box/edges clean; no extra jewels/text.',
            'CG_019_lighthouse-archive': 'R3 previously accepted: four distinct tasks, calm dawn, wet road, unarmed driver. R4: blank form remains blank; hands/boxes/lighting clean.',
          }

          scene_cards = {}
          for p in sorted((root/'03_intermediate/scene_cards').glob('CG_*.json')):
              d=json.loads(p.read_text())
              scene_cards[d['cg_id']]=d

          scenes=[]
          for cid in sorted(scene_cards):
              card=scene_cards[cid]
              path=r3dir/f'{cid}_R3_accepted_v1.png'
              if not path.exists():
                  raise SystemExit(f'missing R3 accepted file: {path}')
              sha=hashlib.sha256(path.read_bytes()).hexdigest()
              rel=str(path.relative_to(root))
              scenes.append({
                  'cg_id': cid,
                  'r3_status': 'accepted',
                  'r4_status': 'accepted-no-rerender',
                  'path': rel,
                  'sha256': sha,
                  'width': 1672,
                  'height': 941,
                  'mode': 'RGB',
                  'scene_title': card.get('title',''),
                  'must_show': card.get('must_show',[]),
                  'must_not_show': card.get('must_not_show',[]),
                  'qa_note': notes[cid],
              })

          r3={
              'version':'2026-09-21-v2',
              'status':'R3 accepted 19/19',
              'accepted_count':19,
              'scenes':scenes,
          }
          r4={
              'version':'2026-09-21-v1',
              'status':'R4 accepted 19/19 without rerender',
              'policy':'An R3 image may be admitted directly as R4 final when it passes all R4 checks; no duplicate generation is required.',
              'accepted_count':19,
              'scenes':scenes,
          }
          (mandir/'cg-r3-accepted-20260921-v2.json').write_text(json.dumps(r3,ensure_ascii=False,indent=2)+'\n')
          (mandir/'cg-r4-accepted-20260921-v1.json').write_text(json.dumps(r4,ensure_ascii=False,indent=2)+'\n')

          lines=[
              '# R3 / R4 Final QA · 2026-09-21','',
              '## Verdict','',
              '- R3 scene pass: **19/19 accepted**.',
              '- R4 final QA: **19/19 accepted**.',
              '- **No R4 rerender is required.** The accepted R3 bytes are admitted directly as final masters after R4 inspection.','',
              '## R4 inspection gates','',
              '- hands / fingers / limbs / faces',
              '- edges and silhouette cleanup',
              '- pseudo-text and watermark scan',
              '- duplicate or count-sensitive props',
              '- cross-character contamination',
              '- line/style consistency',
              '- color, noise, depth of field and lighting','',
              '## Per-CG results','',
              '| CG | R3 | R4 | QA note |',
              '|---|---|---|---|',
          ]
          for s in scenes:
              lines.append(f"| \`{s['cg_id']}\` | PASS | PASS | {s['qa_note']} |")
          lines += [
              '',
              '## Count-sensitive checks explicitly re-verified','',
              '- `CG_004`: seven separated light segments + three queen seal tablets.',
              '- `CG_005`: five-string shell harp; human legs; no second instrument.',
              '- `CG_008`: seven cores + three seal tablets + clear central gap; cooperative action.',
              '- `CG_012`: one green status light; one evidence/tag arrangement; no duplicate ledger.',
              '- `CG_018`: one alarm stone; one mail crate; final volume present.','',
              '## Notes','',
              '- `CG_017` contains abstract holographic record glyphs, but they are non-readable decorative/evidence marks rather than pseudo-language; accepted under the no-readable-UI rule.',
              '- Background heraldic/celestial symbols across the set are treated as established environment motifs, not text.',
              '- This QA does not promote files into `public/assets/anime/cg/`; runtime export should occur only after manifest/mapping update and regression checks.',''
          ]
          (qadir/'R3_R4_FINAL_QA.md').write_text('\n'.join(lines))

          handoff = """# R3 / R4 Final Art Handoff · 2026-09-21

## Current accepted state

- Canon: unchanged; continue using the existing Canon-first reference chain.
- CG R0: **19/19 accepted**.
- CG R1: **19/19 accepted**.
- CG R2: **19/19 accepted**.
- CG R3: **19/19 accepted**.
- CG R4 final QA: **19/19 accepted**.
- R4 rerender: **not required**; the accepted R3 masters passed the final inspection gate.

## Authoritative files

- `03_intermediate/qa/2026-09-21-r3-r4-final/R3_R4_FINAL_QA.md`
- `03_intermediate/qa/2026-09-21-r3-r4-final/R3_R4_FINAL_19_CONTACT_SHEET.jpg`
- `05_manifests/cg-r3-accepted-20260921-v2.json`
- `05_manifests/cg-r4-accepted-20260921-v1.json`
- `04_cg/working/R3-scene/2026-09-21/CG_*_R3_accepted_v1.png`

## Important runtime boundary

These accepted final masters are still production-source assets. They should **not** overwrite `public/assets/anime/cg/*` until deterministic WebP export, mapping update, regression tests and final `/art-audit` are completed.

## Next step

1. Export runtime WebP deterministically from the R4-accepted masters.
2. Update runtime CG mappings.
3. Run regression tests.
4. Open `/art-audit` for final human acceptance.
5. Only then publish/deploy runtime replacements.
"""
          (root/'SESSION_ART_HANDOFF_2026-09-21-R3-R4-FINAL.md').write_text(handoff)

      - name: Commit QA and manifests to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add art/visual-novel/03_intermediate/qa/2026-09-21-r3-r4-final
          git add art/visual-novel/05_manifests/cg-r3-accepted-20260921-v2.json
          git add art/visual-novel/05_manifests/cg-r4-accepted-20260921-v1.json
          git add art/visual-novel/SESSION_ART_HANDOFF_2026-09-21-R3-R4-FINAL.md
          git status --short
          git commit -m "docs: record CG R3 R4 final acceptance"
          git push origin HEAD:main
