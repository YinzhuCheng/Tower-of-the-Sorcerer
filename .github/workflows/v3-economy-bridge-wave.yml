name: V3 Economy Bridge Wave

on:
  push:
    branches:
      - solver-phase1-pareto
    paths:
      - 'src/analyzer/event-order-core-economy-bridge-wave.js'
      - 'src/analyzer/event-order-core-transition-chain.js'
      - 'src/solver/goal-frontier.js'
      - 'src/solver/late-game-threshold-priority-adapter.js'
      - 'src/solver/late-game-zero-damage-harvest-adapter.js'
      - 'src/tuner/review-candidate-v3-rebuild.js'
      - 'src/tuner/review-candidates.js'
      - 'scripts/analyze-v3-event-order-economy-bridge-wave.mjs'
      - 'test/event-order-core-economy-bridge-wave.test.js'
      - 'docs/v3-economy-bridge-wave.md'
      - 'docs/v3-multibridge-roundrobin-result-2026-08-26.md'
      - '.github/workflows/v3-economy-bridge-wave.yml'
  pull_request:
    paths:
      - 'src/analyzer/event-order-core-economy-bridge-wave.js'
      - 'src/analyzer/event-order-core-transition-chain.js'
      - 'src/solver/goal-frontier.js'
      - 'src/solver/late-game-threshold-priority-adapter.js'
      - 'src/solver/late-game-zero-damage-harvest-adapter.js'
      - 'src/tuner/review-candidate-v3-rebuild.js'
      - 'src/tuner/review-candidates.js'
      - 'scripts/analyze-v3-event-order-economy-bridge-wave.mjs'
      - 'test/event-order-core-economy-bridge-wave.test.js'
      - 'docs/v3-economy-bridge-wave.md'
      - 'docs/v3-multibridge-roundrobin-result-2026-08-26.md'
      - '.github/workflows/v3-economy-bridge-wave.yml'
  workflow_dispatch:
    inputs:
      max_prefix_seeds:
        description: 'Number of c6 prefix families to sample'
        required: false
        default: '6'
      suffix_max_expanded_per_bridge:
        description: 'Expansion budget per purchase-lag c7 suffix'
        required: false
        default: '3000'

concurrency:
  group: v3-economy-bridge-wave-${{ github.ref }}
  cancel-in-progress: true

jobs:
  economy-wave:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Analyze purchase-lag c7 economy bridges
        env:
          MAX_PREFIX_SEEDS: ${{ inputs.max_prefix_seeds || '6' }}
          SUFFIX_MAX_EXPANDED: ${{ inputs.suffix_max_expanded_per_bridge || '3000' }}
        run: |
          node scripts/analyze-v3-event-order-economy-bridge-wave.mjs \
            --from-cores=6 \
            --to-cores=7 \
            --from-boundary-max-expanded=8000 \
            --from-boundary-max-generated=100000 \
            --from-boundary-max-goals=64 \
            --max-prefix-seeds="$MAX_PREFIX_SEEDS" \
            --bridge-max-expanded-per-prefix=2500 \
            --bridge-max-generated-per-prefix=35000 \
            --bridge-max-goals-per-prefix=8 \
            --suffix-max-expanded-per-bridge="$SUFFIX_MAX_EXPANDED" \
            --suffix-max-generated-per-bridge=50000 \
            --suffix-priority-slack-bucket=500 \
            --json > v3-economy-bridge-wave.json
      - name: Print economy-bridge evidence
        if: always()
        run: |
          python3 - <<'PY'
          import json, os
          path='v3-economy-bridge-wave.json'
          if not os.path.exists(path) or os.path.getsize(path) == 0:
              print('V3 economy bridge report was not produced.')
              raise SystemExit(0)
          x=json.load(open(path)); r=x.get('analysis') or {}; e=r.get('exploit') or {}; ps=r.get('prefixSchedule') or {}
          print(f"V3_ECONOMY status={r.get('status')} exploit={r.get('exploitFound')} exactNo={r.get('exactNoExploit')} reference={(x.get('rebuild') or {}).get('terminalHp')} semantic={(x.get('rebuild') or {}).get('semanticFingerprint')}")
          print(f"PREFIX relevant={ps.get('verifiedRelevantPrefixCount')} scheduled={ps.get('scheduledPrefixCount')} all={ps.get('attemptedAllVerified')} boundaryExact={(r.get('fromBoundary') or {}).get('coverageExact')} boundaryStop={(r.get('fromBoundary') or {}).get('stoppedReason')}")
          for p in r.get('prefixAttempts') or []:
              s=p.get('selectedBridge') or {}
              print(f"SELECT prefix={p.get('prefixCertificateHash')} histogram={p.get('purchaseHistogram')} bridge={s.get('id')} hp={(s.get('resources') or {}).get('hp')} gold={(s.get('resources') or {}).get('gold')} p={s.get('shopPurchases')} ub={s.get('upperBound')}")
          for a in (r.get('suffix') or {}).get('attempts') or []:
              s=a.get('solver') or {}; t=s.get('telemetry') or {}
              print(f"SUFFIX prefix={a.get('prefixCertificateHash')} bridge={a.get('bridgeId')} hp={(a.get('resources') or {}).get('hp')} gold={(a.get('resources') or {}).get('gold')} p={a.get('shopPurchases')} ub={a.get('upperBound')} expanded={s.get('expandedStates')} generated={s.get('generatedStates')} bound={s.get('prunedBound')} exact={s.get('exact')} stop={s.get('stoppedReason')} travel={t.get('travelGeneratedRatio')} late={t.get('lateFloorExpandedRatio')} exploit={a.get('exploit')}")
          print(f"EXPLOIT hp={e.get('terminalHp')} delta={e.get('deltaHp')} gain={e.get('relativeGain')} replay={(e.get('witnessReplay') or {}).get('ok')} witness={(e.get('witness') or {}).get('witnessHash')} semantic={(e.get('witness') or {}).get('semanticFingerprint')}")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v3-economy-bridge-wave
          path: v3-economy-bridge-wave.json
          if-no-files-found: warn
          retention-days: 14
