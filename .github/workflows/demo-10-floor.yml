name: 10F Playable Demo
on:
  push:
    branches: [demo-10-floor-codesign]
    paths:
      - 'src/game/demo-10-floor-content.js'
      - 'src/demo-main.js'
      - 'index.html'
      - 'scripts/validate-demo-10f.mjs'
      - 'test/demo-10-floor-content.test.js'
      - 'test/demo-10-floor-engine.test.js'
      - 'package.json'
      - 'docs/demo-10-floor-vertical-slice.md'
      - 'docs/demo-10-floor-result-2026-08-27.md'
      - '.github/workflows/demo-10-floor.yml'
  pull_request:
    paths:
      - 'src/game/demo-10-floor-content.js'
      - 'src/demo-main.js'
      - 'index.html'
      - 'scripts/validate-demo-10f.mjs'
      - 'test/demo-10-floor-content.test.js'
      - 'test/demo-10-floor-engine.test.js'
      - 'package.json'
      - 'docs/demo-10-floor-vertical-slice.md'
      - 'docs/demo-10-floor-result-2026-08-27.md'
      - '.github/workflows/demo-10-floor.yml'
  workflow_dispatch:

concurrency:
  group: demo-10-floor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Preserve eight-floor research regression suite
        run: npm run check
      - name: Validate ten-floor authoritative heuristic portfolio
        run: npm run validate:demo10
      - name: Smoke-test real browser boot with local Canvas fallback
        run: |
          python3 -m http.server 4173 > /tmp/tower-demo-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 0.25
          done
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$chrome" ]; then
            echo 'No headless Chrome binary available on runner.' >&2
            exit 1
          fi
          "$chrome" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --disable-dev-shm-usage \
            --virtual-time-budget=7000 \
            --dump-dom http://127.0.0.1:4173/ \
            > /tmp/tower-demo-dom.html \
            2> /tmp/tower-demo-browser.log
          grep -q '10F VERTICAL SLICE' /tmp/tower-demo-dom.html
          grep -q '第 1 阵' /tmp/tower-demo-dom.html
          grep -q '月白门廊' /tmp/tower-demo-dom.html
          grep -q '<canvas' /tmp/tower-demo-dom.html
          if grep -q '启动失败：' /tmp/tower-demo-dom.html; then
            cat /tmp/tower-demo-browser.log >&2
            exit 1
          fi
          echo '10F browser smoke passed with rendered canvas and initialized HUD.'
