name: V3 C6 Cross-Floor Late Shop Counterexample Hunt
on:
  push:
    branches: [solver-phase1-pareto]
    paths:
      - 'src/solver/fixed-purchase-affordable-shop-closure-adapter.js'
      - 'src/solver/fixed-purchase-cross-floor-zero-damage-closure-adapter.js'
      - 'src/analyzer/event-order-c6-cross-floor-late-shop-counterexample-hunt.js'
      - 'scripts/analyze-v3-c6-cross-floor-late-shop-counterexample-hunt.mjs'
      - 'test/fixed-purchase-affordable-shop-closure-adapter.test.js'
      - 'test/fixed-purchase-cross-floor-zero-damage-closure-adapter.test.js'
      - 'docs/v3-c6-cross-floor-late-shop-counterexample-hunt.md'
      - '.github/workflows/v3-c6-cross-floor-late-shop-counterexample-hunt.yml'
  pull_request:
    paths:
      - 'src/solver/fixed-purchase-affordable-shop-closure-adapter.js'
      - 'src/solver/fixed-purchase-cross-floor-zero-damage-closure-adapter.js'
      - 'src/analyzer/event-order-c6-cross-floor-late-shop-counterexample-hunt.js'
      - 'scripts/analyze-v3-c6-cross-floor-late-shop-counterexample-hunt.mjs'
      - 'test/fixed-purchase-affordable-shop-closure-adapter.test.js'
      - 'test/fixed-purchase-cross-floor-zero-damage-closure-adapter.test.js'
      - 'docs/v3-c6-cross-floor-late-shop-counterexample-hunt.md'
      - '.github/workflows/v3-c6-cross-floor-late-shop-counterexample-hunt.yml'
  workflow_dispatch:
    inputs:
      suffix_max_expanded_per_bridge:
        required: false
        default: '3000'
      max_suffix_bridges:
        required: false
        default: '6'

concurrency:
  group: v3-c6-cross-floor-late-shop-counterexample-hunt-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Run monotone closure unit tests
        run: |
          node --test test/fixed-purchase-zero-damage-closure-adapter.test.js
          node --test test/fixed-purchase-cross-floor-zero-damage-closure-adapter.test.js
          node --test test/fixed-purchase-affordable-shop-closure-adapter.test.js
      - name: Hunt V3 from the same c7 bridge portfolio with late shop closure
        env:
          SUFFIX_MAX_EXPANDED: ${{ inputs.suffix_max_expanded_per_bridge || '3000' }}
          MAX_SUFFIX_BRIDGES: ${{ inputs.max_suffix_bridges || '6' }}
        run: |
          node scripts/analyze-v3-c6-cross-floor-late-shop-counterexample-hunt.mjs \
            --from-cores=6 --to-cores=7 \
            --from-boundary-max-expanded=8000 \
            --from-boundary-max-generated=100000 \
            --from-boundary-max-goals=64 \
            --max-prefix-seeds=6 \
            --bridge-max-expanded-per-prefix=6000 \
            --bridge-max-generated-per-prefix=90000 \
            --bridge-max-goals-per-prefix=32 \
            --max-suffix-bridges="$MAX_SUFFIX_BRIDGES" \
            --suffix-max-expanded-per-bridge="$SUFFIX_MAX_EXPANDED" \
            --suffix-max-generated-per-bridge=50000 \
            --suffix-priority-slack-bucket=500 \
            --json > v3-c6-cross-floor-late-shop-counterexample-hunt.json
      - name: Print late-shop evidence
        if: always()
        run: |
          python3 - <<'PY'
          import json, os
          p='v3-c6-cross-floor-late-shop-counterexample-hunt.json'
          if not os.path.exists(p) or os.path.getsize(p)==0:
              print('V3 late-shop counterexample report missing')
              raise SystemExit(0)
          x=json.load(open(p)); r=x.get('analysis') or {}; b=r.get('bridgeSummary') or {}; e=r.get('exploit') or {}; f=r.get('fromBoundary') or {}
          print(f"V3_LATE_SHOP status={r.get('status')} exploit={r.get('exploitFound')} reference={(x.get('rebuild') or {}).get('terminalHp')} semantic={(x.get('rebuild') or {}).get('semanticFingerprint')}")
          print(f"C6 exact={f.get('coverageExact')} stop={f.get('stoppedReason')} active={f.get('activeGoalLabels')} expanded={f.get('expandedStates')} generated={f.get('generatedStates')} searchStruct={f.get('structuralStates')}")
          print(f"BRIDGES active={b.get('activePareto')} residualBefore={b.get('residualBeforeLateShop')} rawScheduled={b.get('scheduledRaw')} normalized={b.get('normalizedReplayVerified')} normFailures={b.get('normalizationFailures')} closedAfter={b.get('boundClosedAfterLateShop')} scheduled={b.get('scheduledNormalized')} families={b.get('scheduledFamilies')}")
          for a in (r.get('suffix') or {}).get('attempts') or []:
              s=a.get('solver') or {}; t=s.get('telemetry') or {}; raw=a.get('rawResources') or {}; res=a.get('resources') or {}; rr=a.get('replay') or {}; lr=a.get('lateShopReplay') or {}
              print(f"SUFFIX prefix={a.get('prefixCertificateHash')} bridge={a.get('bridgeId')} rawP={a.get('rawShopPurchases')} rawHP={raw.get('hp')} rawGold={raw.get('gold')} p={a.get('shopPurchases')} hp={res.get('hp')} gold={res.get('gold')} rawTight={a.get('rawTightUpperBound')} tight={a.get('tightUpperBound')} norm={a.get('lateShopNormalization')} normReplay={lr.get('ok')} normStruct={lr.get('structuralMatch')} expanded={s.get('expandedStates')} generated={s.get('generatedStates')} bound={s.get('prunedBound')} structural={s.get('structuralStates')} exact={s.get('exact')} stop={s.get('stoppedReason')} travel={t.get('travelGeneratedRatio')} late={t.get('lateFloorExpandedRatio')} replay={rr.get('ok')} objective={rr.get('objective')} exploit={a.get('exploit')}")
          print(f"EXPLOIT hp={e.get('terminalHp')} delta={e.get('deltaHp')} gain={e.get('relativeGain')} witnessReplay={(e.get('witnessReplay') or {}).get('ok')} witnessObjective={(e.get('witnessReplay') or {}).get('objective')} semantic={(e.get('witness') or {}).get('semanticFingerprint')}")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v3-c6-cross-floor-late-shop-counterexample-hunt
          path: v3-c6-cross-floor-late-shop-counterexample-hunt.json
          if-no-files-found: warn
          retention-days: 14
