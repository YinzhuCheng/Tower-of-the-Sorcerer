<!doctype html>
<html lang="zh-Hans"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="dark"><title>原画 · 落脚审阅</title><link rel="stylesheet" href="styles.css"></head>
<body>
<main id="app" aria-label="原画与人物落脚审阅">
 <header class="topbar"><div class="brand"><span class="brand-mark" aria-hidden="true">◒</span><span>原画 <span class="muted">/</span> 落脚审阅</span></div><nav class="scene-tabs" aria-label="场景"><button data-scene="forest" class="selected" aria-pressed="true">双根涧</button><button data-scene="harbor" aria-pressed="false">灯港</button></nav><button id="qa-toggle" class="quiet" aria-expanded="false" aria-controls="qa-panel">审阅</button></header>
 <section id="stage" aria-label="原始场景画布"><canvas id="scene" tabindex="0" aria-label="原始场景与四向静态人物参考"></canvas><div class="scene-caption" aria-hidden="true"><span id="scene-subtitle"></span><span id="scene-title"></span></div><div id="load-status" role="status">正在载入原画…</div><div class="stage-tools"><button id="hero-toggle" class="glass" aria-pressed="true" title="显示或隐藏静态人物">人物</button><button id="frame-toggle" class="glass" title="完整原画 / 原始像素">原像素</button><button id="path-toggle" class="glass" hidden aria-pressed="false" title="显示可点击的限定路径目标">路径</button><button id="recenter" class="glass" title="回到人物脚位">归位</button></div></section>
 <footer class="bottom-bar"><div class="pose-control"><label for="anchor-select" class="sr-only">脚位锚点</label><select id="anchor-select"></select><span id="nav-status" class="status-dot">定位审阅</span></div><div class="facing-controls" role="group" aria-label="四向静态参考"><button data-facing="front" class="selected" aria-pressed="true">前</button><button data-facing="back" aria-pressed="false">后</button><button data-facing="left" aria-pressed="false">左</button><button data-facing="right" aria-pressed="false">右</button></div><span id="toast" role="status" aria-live="polite" hidden></span><span class="pose-badge">静态 QA 姿势<span> · 非步行动画</span></span></footer>
 <aside id="qa-panel" hidden aria-label="审阅信息"><div class="panel-heading"><h1>脚位与原画</h1><button id="qa-close" aria-label="关闭审阅信息">关闭</button></div><p class="panel-intro">用于看清画质、比例与遮挡问题。当前不是成品游戏。</p><dl id="measurements"></dl><fieldset><legend>画布标记</legend><label><input id="feet-overlay" type="checkbox">脚底支点 / 1.7m 参考线</label><label><input id="anchors-overlay" type="checkbox">当前场景的审阅定位点</label><label><input id="mask-overlay" type="checkbox">显示已登记遮挡轮廓</label></fieldset><fieldset id="route-controls" hidden><legend>限定路径 · 静态姿势</legend><div class="route-buttons"><button id="pause-route">暂停</button><button id="step-route">前进一步</button></div><p id="route-status">选择命名起点，显示定位点后点击目标</p></fieldset><div id="scene-warning" class="scene-warning" hidden></div><h2>未验收项</h2><ul id="issue-list"></ul><p id="scope-note"></p><p class="evidence-note">源图哈希与几何单测可核验。桌面及窄屏浏览器截图尚待官方 CI；这里不把离线合成图当截图。</p></aside>
</main><script type="module" src="src/app.mjs"></script></body></html>
